# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # Must stay explicit: the default of 100 instances x 1 CPU exceeds the
  # project's europe-west4 Cloud Run quota (20 CPU), and Cloud Run then
  # rejects the rollout. Also a cost cap.
  maxInstances: 10
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Absolute origin for og:image / twitter:image. Without it the app sees the
  # internal Cloud Run URL, which scrapers get a 403 from. See app/root.tsx.
  - variable: PUBLIC_ORIGIN
    value: https://kalender.christmas
    availability:
      - RUNTIME

# Configure environment variables.
# See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
# - variable: MESSAGE
#   value: Hello world!
#   availability:
#     - BUILD
#     - RUNTIME

# Grant access to secrets in Cloud Secret Manager.
# See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
