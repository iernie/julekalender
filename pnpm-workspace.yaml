allowBuilds:
  # Required by App Hosting: this postinstall script bakes FIREBASE_WEBAPP_CONFIG
  # into @firebase/util/dist/postinstall.mjs so no-arg initializeApp() works.
  # Disabling it makes the deployed client initialize with no apiKey.
  "@firebase/util": true
  protobufjs: true
  re2: true
pmOnFail: ignore
# App Hosting's nodejs runtime resolves externalized ESM imports (firebase-admin
# and its transitive deps, plus the CJS react-tooltip/react-confetti deps) from
# the top level of node_modules. pnpm's default isolated layout hides transitive
# packages there, so use npm's flat layout instead.
nodeLinker: hoisted
