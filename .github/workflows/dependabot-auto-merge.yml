name: Dependabot auto-merge

# pull_request_target gives this job a write-capable GITHUB_TOKEN. It never
# checks out the PR, so no code from the pull request is executed.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0

      # npm minor/patch only: majors need a human, and GitHub Actions PRs
      # cannot merge until actions.lock is regenerated by hand.
      - name: Approve and enable auto-merge
        if: >-
          steps.metadata.outputs.package-ecosystem == 'npm' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: |
            gh pr review --approve "$PR_URL"
            gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
