name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # setup-node needs pnpm on PATH before `cache: pnpm` can work. Pin the
      # version here rather than in package.json: pnpm 12 writes a two-document
      # lockfile when packageManager is set, which breaks Dependabot alerts.
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            functions/pnpm-lock.yaml

      # The Firestore and Storage emulators are Java processes.
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir functions install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build functions
        run: pnpm --dir functions run build

      - name: Build
        run: pnpm build

      - name: Security rules tests
        run: pnpm test:rules
